name: Collect daily market inputs

on:
  schedule:
    - cron: "10 8 * * *"
      timezone: "Asia/Seoul"
    - cron: "15 16 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      channels:
        description: "채널 ID/URL (쉼표 구분, 비우면 channels.json 전체)"
        required: false
        default: ""
        type: string
      max_pages_per_channel:
        description: "최근 구간 탐색 시 채널별 안전 페이지 한도"
        required: true
        default: "100"
        type: string
      window_hours:
        description: "현재 시각부터 몇 시간 전까지 수집할지"
        required: true
        default: "12"
        type: string
      report_type:
        description: "생성할 Gemini 입력의 보고서 유형"
        required: true
        default: "MORNING_0810"
        type: choice
        options:
          - "MORNING_0810"
          - "CLOSE_1630"
      workers:
        description: "동시 수집 채널 수"
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "4"
          - "6"
      request_delay_seconds:
        description: "채널별 페이지 요청 간격(초)"
        required: true
        default: "0.6"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-market-inputs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect public messages
        timeout-minutes: 300
        shell: bash
        env:
          INPUT_CHANNELS: ${{ inputs.channels }}
          INPUT_MAX_PAGES: ${{ inputs.max_pages_per_channel || '100' }}
          INPUT_WINDOW_HOURS: ${{ inputs.window_hours || '12' }}
          INPUT_WORKERS: ${{ inputs.workers || '4' }}
          INPUT_DELAY: ${{ inputs.request_delay_seconds || '0.6' }}
        run: |
          python collector.py \
            --channels "$INPUT_CHANNELS" \
            --max-pages "$INPUT_MAX_PAGES" \
            --window-hours "$INPUT_WINDOW_HOURS" \
            --workers "$INPUT_WORKERS" \
            --delay "$INPUT_DELAY" \
            --output-dir output

      - name: Include Gemini prompt
        if: ${{ success() }}
        run: cp prompts/gemini_market_brief_ko.md output/gemini_market_brief_prompt.md

      - name: Render copy-paste Markdown
        if: ${{ success() }}
        env:
          REPORT_TYPE: >-
            ${{ inputs.report_type ||
                (github.event.schedule == '15 16 * * *' && 'CLOSE_1630') ||
                'MORNING_0810' }}
        run: |
          python render_results.py \
            --input output/market_inputs.json \
            --prompt prompts/gemini_market_brief_ko.md \
            --report-type "$REPORT_TYPE" \
            --copy-output output/gemini_copy_paste.md \
            --sources-output output/market_inputs.md

      - name: Upload archive
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-market-inputs-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Package downloadable files
        if: ${{ success() }}
        run: python -m zipfile -c market-inputs.zip output

      - name: Publish latest downloadable files
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: >-
            Latest 12-hour Telegram and FuturesNow input bundle generated by
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
        run: |
          if gh release view latest-data >/dev/null 2>&1; then
            gh release upload latest-data \
              market-inputs.zip \
              output/market_inputs.json \
              output/market_inputs.csv \
              output/market_inputs.jsonl \
              output/manifest.json \
              output/gemini_market_brief_prompt.md \
              output/gemini_copy_paste.md \
              output/market_inputs.md \
              --clobber
            gh release edit latest-data \
              --title "Latest daily market inputs" \
              --notes "$RELEASE_NOTES" \
              --latest
          else
            gh release create latest-data \
              market-inputs.zip \
              output/market_inputs.json \
              output/market_inputs.csv \
              output/market_inputs.jsonl \
              output/manifest.json \
              output/gemini_market_brief_prompt.md \
              output/gemini_copy_paste.md \
              output/market_inputs.md \
              --title "Latest daily market inputs" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Publish visible results folder
        if: ${{ success() }}
        shell: bash
        env:
          REPORT_TYPE: >-
            ${{ inputs.report_type ||
                (github.event.schedule == '15 16 * * *' && 'CLOSE_1630') ||
                'MORNING_0810' }}
        run: |
          git pull --rebase origin main
          mkdir -p results/archive
          cp output/gemini_copy_paste.md results/latest.md
          cp output/market_inputs.md results/latest_sources.md
          cp output/gemini_copy_paste.md \
            "results/archive/${GITHUB_RUN_ID}-${REPORT_TYPE}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if ! git diff --cached --quiet; then
            git commit -m "Update collected market results (${GITHUB_RUN_ID})"
            git push origin HEAD:main
          fi

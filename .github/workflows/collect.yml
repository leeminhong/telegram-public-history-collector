name: Collect Telegram public history

on:
  workflow_dispatch:
    inputs:
      channels:
        description: "채널 ID/URL (쉼표 구분, 비우면 channels.json 전체)"
        required: false
        default: ""
        type: string
      max_pages_per_channel:
        description: "채널별 최대 페이지 (0은 공개 이력 끝까지)"
        required: true
        default: "0"
        type: string
      workers:
        description: "동시 수집 채널 수"
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "4"
          - "6"
      request_delay_seconds:
        description: "채널별 페이지 요청 간격(초)"
        required: true
        default: "0.6"
        type: string

permissions:
  contents: write

concurrency:
  group: telegram-public-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect public messages
        timeout-minutes: 300
        shell: bash
        env:
          INPUT_CHANNELS: ${{ inputs.channels }}
          INPUT_MAX_PAGES: ${{ inputs.max_pages_per_channel }}
          INPUT_WORKERS: ${{ inputs.workers }}
          INPUT_DELAY: ${{ inputs.request_delay_seconds }}
        run: |
          python collector.py \
            --channels "$INPUT_CHANNELS" \
            --max-pages "$INPUT_MAX_PAGES" \
            --workers "$INPUT_WORKERS" \
            --delay "$INPUT_DELAY" \
            --output-dir output

      - name: Upload archive
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-public-history-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Package downloadable files
        if: ${{ success() }}
        run: python -m zipfile -c telegram-public-history.zip output

      - name: Publish latest downloadable files
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: >-
            Latest public Telegram archive generated by
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
        run: |
          if gh release view latest-data >/dev/null 2>&1; then
            gh release upload latest-data \
              telegram-public-history.zip \
              output/all_messages.csv \
              output/all_messages.jsonl \
              output/manifest.json \
              --clobber
            gh release edit latest-data \
              --title "Latest Telegram public history" \
              --notes "$RELEASE_NOTES" \
              --latest
          else
            gh release create latest-data \
              telegram-public-history.zip \
              output/all_messages.csv \
              output/all_messages.jsonl \
              output/manifest.json \
              --title "Latest Telegram public history" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
